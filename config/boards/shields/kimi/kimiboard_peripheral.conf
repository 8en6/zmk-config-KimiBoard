
# Bluetoothデバイス名
CONFIG_BT_DEVICE_NAME="KimiBoard(BT)"

# USBデバイス名
CONFIG_USB_DEVICE_PRODUCT="KimiBoard(USB)"

# トラックボール
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_NFCT_PINS_AS_GPIOS=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=1200
CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_ZMK_BLE=y
CONFIG_PMW3610_POLLING_RATE_125_SW=y

# Sensor mounting correction stays at ORIENTATION_180.
# Rotate the body 180 degrees relative to the original upright position.
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_Y=y
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_SMART_ALGORITHM=y

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_USB=n
CONFIG_ZMK_STUDIO=n
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
