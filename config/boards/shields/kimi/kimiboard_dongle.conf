CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_KEYBOARD_NAME="KimiBoard Dongle"
CONFIG_USB_DEVICE_PRODUCT="KimiBoard Dongle"
CONFIG_BT_MAX_CONN=2
# Three host profiles plus one bonded KimiBoard peripheral.
CONFIG_BT_MAX_PAIRED=4
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
# Keep the BLE name below Zephyr v0.3 stack length limit.
CONFIG_BT_DEVICE_NAME="KimiDongle"
